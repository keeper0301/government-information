name: Naver SEO HTML audit

on:
  schedule:
    # KST 09:25 — Naver Search Advisor issue counts lag, so keep our own crawler-visible regression audit daily.
    - cron: "25 0 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Audit target site"
        required: false
        default: "https://www.keepioo.com"
      limit:
        description: "Sitemap URL sample limit"
        required: false
        default: "32"
      fail_on_issues:
        description: "Fail the run when crawler-visible SEO issues are found"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      fail_on_warning_increase:
        description: "Fail when warning count or row-level warning signals increase vs previous artifact"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_urls:
        description: "Additional URLs outside sitemap sample, newline or comma separated"
        required: false
        default: "https://www.keepioo.com/welfare/31d7f2a9-4da2-44b3-8728-9510fe097545,https://www.keepioo.com/loan/region/daegu,https://www.keepioo.com/news"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: sitemap HTML metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: Node 24 설치 + npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 의존성 설치 (lockfile 기준)
        run: npm ci

      - name: Naver SEO HTML audit 실행
        env:
          SITE: ${{ inputs.site || 'https://www.keepioo.com' }}
          LIMIT: ${{ inputs.limit || '32' }}
          FAIL_ON_ISSUES: ${{ inputs.fail_on_issues || 'true' }}
          EXTRA_URLS: ${{ inputs.extra_urls || 'https://www.keepioo.com/welfare/31d7f2a9-4da2-44b3-8728-9510fe097545,https://www.keepioo.com/loan/region/daegu,https://www.keepioo.com/news' }}
        run: |
          set -euo pipefail
          args=(--site "$SITE" --limit "$LIMIT")
          if [ -n "${EXTRA_URLS:-}" ]; then
            args+=(--extra-urls "$EXTRA_URLS")
          fi
          if [ "$FAIL_ON_ISSUES" = "true" ]; then
            args+=(--fail-on-issues)
          fi
          npm run diagnose:naver-seo-html -- "${args[@]}" --json-output /tmp/naver-seo-html-audit.json 2>&1 | tee /tmp/naver-seo-html-audit.log

      - name: GitHub Summary 작성
        if: always()
        run: |
          if [ ! -s /tmp/naver-seo-html-audit.json ]; then
            echo "## Naver SEO HTML audit" >> "$GITHUB_STEP_SUMMARY"
            echo "audit JSON 결과가 없습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/naver-seo-html-audit.json', 'utf8'));
          const issueEntries = Object.entries(result.issueCounts || {}).sort((a, b) => b[1] - a[1]);
          const warningEntries = Object.entries(result.warningCounts || {}).sort((a, b) => b[1] - a[1]);
          const extraUrls = Array.isArray(result.extraUrls) ? result.extraUrls : [];
          const lines = [
            '## Naver SEO HTML audit',
            '',
            `- site: ${result.site || 'unknown'}`,
            `- sitemap: ${result.sitemap || 'unknown'}`,
            `- limit: ${result.limit ?? 'unknown'}`,
            `- extra URLs: ${extraUrls.length}`,
            `- checked: ${result.okCount}/${result.urlCount}`,
            `- issues: ${issueEntries.length === 0 ? '0' : issueEntries.map(([key, count]) => `${key} ${count}`).join(', ')}`,
            `- warnings: ${warningEntries.length === 0 ? '0' : warningEntries.map(([key, count]) => `${key} ${count}`).join(', ')}`,
            `- duplicate titles: ${result.duplicateTitles?.length || 0}`,
            `- duplicate descriptions: ${result.duplicateDescriptions?.length || 0}`,
          ];
          if ((result.issueRows || []).length > 0) {
            lines.push('', '### issue sample');
            for (const row of result.issueRows.slice(0, 5)) {
              lines.push(`- ${row.url} — ${(row.issues || []).join(', ')}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: 이전 audit artifact와 비교
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          FAIL_ON_WARNING_INCREASE: ${{ inputs.fail_on_warning_increase || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/naver-seo-html-audit.json ]; then
            echo "## Naver SEO HTML audit compare" >> "$GITHUB_STEP_SUMMARY"
            echo "현재 audit JSON 결과가 없어 비교를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous_run_id=$(gh run list --repo "$REPO" --workflow naver-seo-html-audit.yml --branch master --status success --limit 20 --json databaseId \
            | node -e "const fs=require('fs'); const current=String(process.env.RUN_ID); const runs=JSON.parse(fs.readFileSync(0,'utf8')); const prev=runs.find((r)=>String(r.databaseId)!==current); if (prev) process.stdout.write(String(prev.databaseId));")
          printf '%s' "${previous_run_id:-}" > /tmp/naver-seo-html-audit-previous-run-id
          if [ -z "${previous_run_id:-}" ]; then
            echo "## Naver SEO HTML audit compare" >> "$GITHUB_STEP_SUMMARY"
            echo "비교할 이전 성공 run이 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p /tmp/naver-seo-previous
          if ! gh run download "$previous_run_id" --repo "$REPO" -n naver-seo-html-audit -D /tmp/naver-seo-previous >/tmp/naver-seo-compare-download.log 2>&1; then
            echo "## Naver SEO HTML audit compare" >> "$GITHUB_STEP_SUMMARY"
            echo "이전 run ${previous_run_id}의 artifact를 받을 수 없어 비교를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous_json=$(find /tmp/naver-seo-previous -name 'naver-seo-html-audit.json' -print -quit)
          if [ -z "${previous_json:-}" ]; then
            echo "## Naver SEO HTML audit compare" >> "$GITHUB_STEP_SUMMARY"
            echo "이전 artifact에 JSON 파일이 없어 비교를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          node tools/naver-seo-html-audit-compare.mjs --before "$previous_json" --after /tmp/naver-seo-html-audit.json --json-output /tmp/naver-seo-html-audit-compare.json --fail-on-regression 2>&1 | tee /tmp/naver-seo-html-audit-compare.log
          hard_status=${PIPESTATUS[0]}
          set -e
          PREVIOUS_RUN_ID="$previous_run_id" node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/naver-seo-html-audit-compare.json', 'utf8'));
          const formatSignals = (row) => `${row.url} — ${(row.signals || []).join(', ')}`;
          const formatScopeValue = (value) => Array.isArray(value) ? (value.length === 0 ? '(none)' : value.join(', ')) : (value ?? '(none)');
          const pushSample = (label, rows) => {
            if (!Array.isArray(rows) || rows.length === 0) return;
            lines.push('', `### ${label}`);
            for (const row of rows.slice(0, 3)) lines.push(`- ${formatSignals(row)}`);
            if (rows.length > 3) lines.push(`- ... ${rows.length - 3} more`);
          };
          const pushScopeSample = (rows) => {
            if (!Array.isArray(rows) || rows.length === 0) return;
            lines.push('', '### audit scope changes');
            for (const row of rows.slice(0, 4)) lines.push(`- ${row.key}: ${formatScopeValue(row.before)} → ${formatScopeValue(row.after)}`);
            if (rows.length > 4) lines.push(`- ... ${rows.length - 4} more`);
          };
          const lines = [
            '',
            '## Naver SEO HTML audit compare',
            '',
            `- compared with previous successful run: ${process.env.PREVIOUS_RUN_ID || 'unknown'}`,
            `- hard regression: ${result.hasHardRegression ? 'yes' : 'no'}`,
            `- warning increase: ${result.hasWarningIncrease ? 'yes' : 'no'}`,
            `- issue deltas: ${result.issueDeltas.length}`,
            `- warning deltas: ${result.warningDeltas.length}`,
            `- scope deltas: ${(result.scopeDeltas || []).length}`,
            `- added issue rows: ${result.addedIssueRows.length}`,
            `- resolved issue rows: ${result.resolvedIssueRows.length}`,
            `- added warning rows: ${result.addedWarningRows.length}`,
            `- resolved warning rows: ${result.resolvedWarningRows.length}`,
          ];
          pushScopeSample(result.scopeDeltas);
          pushSample('added issue sample', result.addedIssueRows);
          pushSample('resolved issue sample', result.resolvedIssueRows);
          pushSample('added warning sample', result.addedWarningRows);
          pushSample('resolved warning sample', result.resolvedWarningRows);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          warning_status=0
          if [ "$FAIL_ON_WARNING_INCREASE" = "true" ]; then
            set +e
            node tools/naver-seo-html-audit-compare.mjs --before "$previous_json" --after /tmp/naver-seo-html-audit.json --fail-on-warning-increase 2>&1 | tee -a /tmp/naver-seo-html-audit-compare.log
            warning_status=${PIPESTATUS[0]}
            set -e
          fi
          if [ "$hard_status" -ne 0 ]; then
            exit "$hard_status"
          fi
          if [ "$warning_status" -ne 0 ]; then
            exit "$warning_status"
          fi

      - name: audit run metadata 작성
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const readJson = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; }
          };
          const readText = (path) => {
            try { return fs.readFileSync(path, 'utf8').trim(); } catch { return ''; }
          };
          const audit = readJson('/tmp/naver-seo-html-audit.json');
          const compare = readJson('/tmp/naver-seo-html-audit-compare.json');
          const manifest = {
            generatedAt: new Date().toISOString(),
            run: {
              repository: process.env.GITHUB_REPOSITORY || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              runId: process.env.GITHUB_RUN_ID || null,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT || null,
              eventName: process.env.GITHUB_EVENT_NAME || null,
              refName: process.env.GITHUB_REF_NAME || null,
              sha: process.env.GITHUB_SHA || null,
              actor: process.env.GITHUB_ACTOR || null,
            },
            previousRunId: readText('/tmp/naver-seo-html-audit-previous-run-id') || null,
            audit: audit ? {
              site: audit.site || null,
              sitemap: audit.sitemap || null,
              limit: audit.limit ?? null,
              extraUrlCount: Array.isArray(audit.extraUrls) ? audit.extraUrls.length : 0,
              checked: `${audit.okCount}/${audit.urlCount}`,
              issueCounts: audit.issueCounts || {},
              warningCounts: audit.warningCounts || {},
            } : null,
            compare: compare ? {
              hasHardRegression: Boolean(compare.hasHardRegression),
              hasWarningIncrease: Boolean(compare.hasWarningIncrease),
              issueDeltas: Array.isArray(compare.issueDeltas) ? compare.issueDeltas.length : 0,
              warningDeltas: Array.isArray(compare.warningDeltas) ? compare.warningDeltas.length : 0,
              scopeDeltas: Array.isArray(compare.scopeDeltas) ? compare.scopeDeltas.length : 0,
              addedIssueRows: Array.isArray(compare.addedIssueRows) ? compare.addedIssueRows.length : 0,
              addedWarningRows: Array.isArray(compare.addedWarningRows) ? compare.addedWarningRows.length : 0,
            } : null,
          };
          fs.writeFileSync('/tmp/naver-seo-html-audit-run.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: audit JSON artifact 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-seo-html-audit
          path: |
            /tmp/naver-seo-html-audit.json
            /tmp/naver-seo-html-audit-compare.json
            /tmp/naver-seo-html-audit.log
            /tmp/naver-seo-html-audit-compare.log
            /tmp/naver-seo-html-audit-run.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET 없음 — GitHub Actions 실패 상태만 남김"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');

          function redactSecrets(text) {
            return String(text || '')
              .replace(/\b(Bearer)\s+[A-Za-z0-9._~+/=-]{12,}/gi, '$1 [REDACTED]')
              .replace(new RegExp('\\b(' + 'Author' + 'ization:' + '\\s*)[^\\n\\r]+', 'gi'), '$1[REDACTED]')
              .replace(/\b([A-Za-z0-9_.-]*(?:token|secret|password|passwd|api[_-]?key|client[_-]?secret)[A-Za-z0-9_.-]*=)([^\s&]+)/gi, '$1[REDACTED]');
          }

          async function main() {
            let log = '';
            try { log = redactSecrets(fs.readFileSync('/tmp/naver-seo-html-audit.log', 'utf8')); } catch {}
            let compareLog = '';
            try { compareLog = redactSecrets(fs.readFileSync('/tmp/naver-seo-html-audit-compare.log', 'utf8')); } catch {}
            const auditSummary = log
              .split('\n')
              .filter((line) => /Naver SEO HTML audit:|Issues:|Warnings:|^- |^https:\/\//.test(line.trim()))
              .slice(0, 10)
              .join('\n') || 'audit log summary unavailable';
            const compareLines = compareLog
              .split('\n')
              .filter((line) => /Naver SEO HTML audit compare:|Issue deltas:|Warning deltas:|Scope deltas:|Added issue rows:|Resolved issue rows:|Added warning rows:|Resolved warning rows:|Changed issue rows:|Changed warning rows:|OK: no hard SEO issue regression|FAIL: hard SEO issue regression detected|WARN: warning signal increased|WARN: audit scope changed|^- /.test(line.trim()));
            const comparePriority = /^(FAIL:|WARN:)/;
            const compareSummary = [
              ...compareLines.filter((line) => comparePriority.test(line.trim())),
              ...compareLines.filter((line) => !comparePriority.test(line.trim())),
            ]
              .slice(0, 14)
              .join('\n');
            const summary = [auditSummary, compareSummary].filter(Boolean).join('\n--- compare ---\n');
            const text = [
              '[keepioo] Naver SEO HTML audit 실패',
              '크롤러 기준 title/description/H1/img-alt 또는 artifact regression 확인 필요',
              '',
              summary,
              '',
              `run: ${process.env.RUN_URL}`,
            ].join('\n');
            const res = await fetch('https://www.keepioo.com/api/notify-telegram', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.CRON_SECRET}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ text }),
            });
            console.log(`notify status: ${res.status}`);
          }

          main().catch((error) => {
            console.warn('notify attempt failed:', error instanceof Error ? error.message : String(error));
          });
          NODE
